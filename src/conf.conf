server {
    listen 8080;
    server_name localhost;
    root /home/julien/Webserv/src/www;
    client_max_body_size 1000000;
    index index.html;
    autoindex on;
    cgi_handler .bla /home/julien/Webserv/cgi_tester;

    location / {
        allowed_methods GET;
    }

    location .bla {
        allowed_methods GET POST;
    }

    location /post_body {
        allowed_methods POST;
        client_max_body_size 100;
    }

    location /directory/ {
        allowed_methods GET;
        root /home/julien/Webserv/src/www/YoupiBanane;
        index youpi.bad_extension;
    }
}