server {
    listen 8080;
    server_name localhost;
    root ./src/www;
    client_max_body_size 1000;
    index index.html;
    autoindex on;
    cgi_handler .bla ./cgi_tester;

    location / {
        allowed_methods GET POST;
    }

    location .bla {
        allowed_methods GET POST;
    }

    location /post_body {
        allowed_methods POST;
        client_max_body_size 100;
    }

    location /directory/ {
        allowed_methods GET;
        alias YoupiBanane;
        index youpi.bad_extension;
    }
}