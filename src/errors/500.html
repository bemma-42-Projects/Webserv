<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>500 - Erreur Serveur</title>
    <style>
        body { background-color: #000; color: #fff; font-family: monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center; }
        h1 { font-size: 5em; color: #ff5555; }
        .blink { animation: blinker 1s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }
    </style>
</head>
<body>
    <h1 class="blink">500</h1>
    <p>ALERTE : Une erreur interne est survenue.</p>
    <p style="font-size: 0.8em; color: #666;">Consultez les logs du serveur pour plus de détails.</p>
</body>
</html>
