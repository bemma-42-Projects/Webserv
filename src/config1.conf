
 # Configuration globale (optionnel selon ton sujet)
# max_clients 100;

server {

    listen 127.0.0.1:8080;
    server_name localhost webserv.com;
    client_max_body_size 10;# a voir pour M

    error_page 404 ./src/errors/404.html;
    error_page 500 502 503 504  ./src/errors/500.html;# a voir pour le x ex: 50x
    root ./src/www;
    index index.html index.php;

    location / {
        allowed_methods GET POST;
        autoindex on;
    }

    location /old-page {
        return 301 http://localhost:8080/new-page;
    }

    location /uploads {
        allowed_upload on;
        allowed_methods POST DELETE;
        upload_path ./src/www/upload;
        autoindex on;
    }

    location /cgi-bin {
        allowed_methods GET POST;
        # Extension associée au binaire du CGI
        #cgi_pass .py /usr/bin/python3;
       # cgi_pass .sh /bin/bash;
    }

    location /secret {
        allowed_methods GET;
        root ./src/www/site1;
        index top_secret.html;
    }
}

server {
    listen 127.0.0.1:8080;
    server_name second_server.fr;

    root ./src/www/site2;
    index home.html;
}
