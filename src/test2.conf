server {
    # Port simple
    listen 8080;
    
    # Nom du serveur
    server_name localhost;
    
    # Le dossier racine magique (existe partout, 0 erreur garantie)
    root /home/rmetge/42/Webserv;
    
    # Configuration de base
    client_max_body_size 1000000;
    index index.php index.html;
    autoindex on;

    
    # Une seule route de base
    location / {
        allowed_methods GET POST DELETE;
    }
}