server {
    listen 8080;
    server_name localhost;
    root ./src/www;
    client_max_body_size 1000;
    index index.html;
    autoindex on;
    
    #cgi_handler .php /usr/bin/php-cgi;
    #cgi_handler .py /usr/bin/python3;

    location / {
        allowed_methods GET;
    }

    location .bla {
        #alias ./src/www/YoupiBanane;
        allowed_methods GET POST;
    }

    location /post_body {
        allowed_methods POST;
        client_max_body_size 100;
    }

    location /directory/ {
        cgi_handler .bla ./cgi_tester;
        allowed_methods GET POST;
        #root /home/julien/Webserv/src/www/YoupiBanane;
        alias ./src/www/YoupiBanane;
        index youpi.bad_extension;
    }
}
